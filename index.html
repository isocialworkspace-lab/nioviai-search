<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Project Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #111827; color: #e5e7eb; font-family: 'Courier New', Courier, monospace; }
    .pixel-text { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
    .hero-sprite { font-size: 4rem; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  </style>
</head>
<body>
  <div id="root">
    <div class="p-10 text-center text-red-400 font-bold text-xl mt-20">
      Φόρτωση Παιχνιδιού... ⏳<br><br>
      <span class="text-sm text-gray-400">Αν η οθόνη μείνει έτσι, ο browser σου μπλοκάρει τη React.<br>Άνοιξε το αρχείο μέσω <b>Live Server</b> (VS Code).</span>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const initialHero = { hp: 100, maxHp: 100, xp: 0, level: 1, gold: 50, atk: 15, def: 5 };

    // Ασφαλής φόρτωση δεδομένων
    const loadData = (key, defaultData) => {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : defaultData;
      } catch (e) {
        return defaultData;
      }
    };

    function App() {
      // States (Με νέο κλειδί 'v3' για να αποφύγουμε corrupted saves)
      const [hero, setHero] = useState(() => loadData('rpg_hero_v3', initialHero));
      const [quests, setQuests] = useState(() => loadData('rpg_quests_v3', []));
      const [logs, setLogs] = useState(() => loadData('rpg_logs_v3', ["Το παιχνίδι φορτώθηκε επιτυχώς!"]));
      
      const [showQuestModal, setShowQuestModal] = useState(false);
      const [editingQuest, setEditingQuest] = useState(null);
      const [combatTarget, setCombatTarget] = useState(null);

      const [formData, setFormData] = useState({ title: '', priority: 1, difficulty: 'Easy', microtasks: '' });

      // Auto-save σε κάθε αλλαγή
      useEffect(() => {
        localStorage.setItem('rpg_hero_v3', JSON.stringify(hero));
        localStorage.setItem('rpg_quests_v3', JSON.stringify(quests));
        localStorage.setItem('rpg_logs_v3', JSON.stringify(logs));
      }, [hero, quests, logs]);

      const addLog = (msg) => setLogs(prev => [msg, ...prev].slice(0, 10));

      // Ενεργό Quest
      const activeQuest = quests
        .filter(q => !q.completed)
        .sort((a, b) => b.priority - a.priority)[0];

      // Δημιουργία/Επεξεργασία
      const handleSaveQuest = (e) => {
        e.preventDefault();
        const mTasks = formData.microtasks.split(',')
          .map(t => t.trim()).filter(t => t)
          .map((t, i) => ({ id: i, name: t, completed: false }));

        if (editingQuest) {
          setQuests(quests.map(q => q.id === editingQuest.id ? { ...q, ...formData, microtasks: mTasks } : q));
          addLog(`Το quest "${formData.title}" ανανεώθηκε.`);
        } else {
          const newQuest = {
            id: Date.now(),
            ...formData,
            completed: false,
            microtasks: mTasks
          };
          setQuests([...quests, newQuest]);
          addLog(`Προστέθηκε νέο Quest: "${formData.title}".`);
        }
        setShowQuestModal(false);
        setEditingQuest(null);
        setFormData({ title: '', priority: 1, difficulty: 'Easy', microtasks: '' });
      };

      // Abandon
      const abandonQuest = (quest) => {
        if(window.confirm(`Εγκατάλειψη του "${quest.title}"; Κοστίζει 10 HP.`)) {
          setQuests(quests.filter(q => q.id !== quest.id));
          setHero(h => ({ ...h, hp: Math.max(0, h.hp - 10) }));
          addLog(`Εγκατέλειψες το "${quest.title}" (-10 HP).`);
        }
      };

      // Reset
      const resetQuest = (quest) => {
        if(window.confirm("Αυτό θα επαναφέρει όλα τα Mobs του Quest. Συνέχεια;")) {
          setQuests(quests.map(q => {
            if (q.id === quest.id) {
              return { ...q, completed: false, microtasks: q.microtasks.map(m => ({ ...m, completed: false })) };
            }
            return q;
          }));
          addLog(`Το quest "${quest.title}" έγινε reset.`);
        }
      };

      // Edit Modal
      const openEdit = (quest) => {
        setEditingQuest(quest);
        setFormData({
          title: quest.title, 
          priority: quest.priority, 
          difficulty: quest.difficulty,
          microtasks: quest.microtasks.map(m => m.name).join(', ')
        });
        setShowQuestModal(true);
      };

      // Μάχη
      const openCombat = (target, isBoss) => {
        if (isBoss) {
          const pending = activeQuest.microtasks.filter(m => !m.completed);
          if (pending.length > 0) {
            alert(`Πρέπει πρώτα να σκοτώσεις τα ${pending.length} Mobs!`);
            return;
          }
        }
        setCombatTarget({ ...target, isBoss });
      };

      const executeCombat = (action) => {
        const enemyDmg = action === 'defend' ? 0 : (combatTarget.isBoss ? 15 : 5);
        const xpGain = action === 'defend' ? 5 : (combatTarget.isBoss ? 100 : 20);
        
        setHero(h => ({ ...h, hp: Math.max(0, h.hp - enemyDmg), xp: h.xp + xpGain }));
        
        if (combatTarget.isBoss) {
          setQuests(quests.map(q => q.id === activeQuest.id ? { ...q, completed: true } : q));
          addLog(`🏆 ΝΙΚΗ! Σκότωσες το Boss: ${activeQuest.title}!`);
        } else {
          const updatedMicrotasks = activeQuest.microtasks.map(m => 
            m.id === combatTarget.id ? { ...m, completed: true } : m
          );
          setQuests(quests.map(q => q.id === activeQuest.id ? { ...q, microtasks: updatedMicrotasks } : q));
          addLog(`💀 Εξόντωσες το mob: ${combatTarget.name}`);
        }
        setCombatTarget(null);
      };

      return (
        <div className="min-h-screen p-4 max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
          
          {/* Ήρωας */}
          <div className="col-span-1 space-y-6">
            <div className="bg-gray-800 p-4 border-2 border-gray-600 rounded">
              <h2 className="text-xl text-yellow-400 mb-2 pixel-text">Ήρωας</h2>
              <div className="text-center mb-4"><span className="hero-sprite">🧙‍♂️</span></div>
              <div className="bg-gray-900 p-3 rounded font-bold space-y-1">
                <div className="flex justify-between text-red-400"><span>HP:</span> <span>{hero.hp}/{hero.maxHp}</span></div>
                <div className="flex justify-between text-blue-400"><span>XP:</span> <span>{hero.xp}</span></div>
                <div className="flex justify-between text-yellow-400"><span>Gold:</span> <span>{hero.gold}</span></div>
              </div>
            </div>

            <div className="bg-gray-800 p-4 border-2 border-gray-600 rounded h-64 overflow-y-auto">
              <h2 className="text-xl text-blue-400 mb-2 pixel-text">Ιστορία</h2>
              <ul className="text-xs space-y-2 text-gray-400">
                {logs.map((log, i) => <li key={i} className="border-b border-gray-700 pb-1">> {log}</li>)}
              </ul>
            </div>
          </div>

          {/* Χάρτης & Quest Board */}
          <div className="col-span-1 md:col-span-2 space-y-6">
            
            {/* Map */}
            <div className="bg-gray-900 p-6 border-4 border-gray-700 rounded relative min-h-[350px]">
              <h2 className="text-2xl text-green-400 mb-4 pixel-text border-b border-gray-700 pb-2">🏰 Ενεργό Δωμάτιο (Map)</h2>
              
              {!activeQuest ? (
                <div className="text-center text-gray-500 mt-10 pixel-text">Πρόσθεσε νέο Quest στο Board!</div>
              ) : (
                <div className="flex flex-col items-center justify-between h-full space-y-8 mt-4">
                  <div className="flex flex-wrap gap-6 justify-center">
                    {activeQuest.microtasks.map(m => !m.completed && (
                      <div key={m.id} onClick={() => openCombat(m, false)} className="cursor-pointer text-center hover:scale-110">
                        <div className="text-5xl">👹</div>
                        <div className="text-xs mt-2 bg-red-900 text-white px-2 py-1 rounded">{m.name}</div>
                      </div>
                    ))}
                  </div>
                  
                  <div onClick={() => openCombat(activeQuest, true)} className={`cursor-pointer text-center ${activeQuest.microtasks.some(m => !m.completed) ? 'opacity-40 grayscale' : 'hover:scale-110 drop-shadow-[0_0_20px_rgba(255,0,0,0.8)]'}`}>
                    <div className="text-7xl mb-2">🐉</div>
                    <div className="text-xl font-bold text-red-500 bg-black px-4 py-1 rounded-full border border-red-900">{activeQuest.title}</div>
                  </div>
                </div>
              )}
            </div>

            {/* Board */}
            <div className="bg-gray-800 p-4 border-2 border-gray-600 rounded">
              <div className="flex justify-between items-center mb-6">
                <h2 className="text-xl text-yellow-500 font-bold pixel-text">📜 Quest Board</h2>
                <button onClick={() => { setEditingQuest(null); setShowQuestModal(true); }} className="bg-green-700 hover:bg-green-600 px-4 py-2 rounded font-bold text-white">+ Νέο Quest</button>
              </div>

              <div className="space-y-4">
                {quests.map(quest => (
                  <div key={quest.id} className={`bg-gray-700 p-4 rounded border-l-4 ${quest.completed ? 'border-green-500 opacity-60' : 'border-yellow-500'} flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4`}>
                    <div>
                      <h3 className="font-bold text-lg text-white">{quest.title}</h3>
                      <div className="text-sm text-gray-300">Pri: {quest.priority} | Mobs: {quest.microtasks.filter(m=>m.completed).length}/{quest.microtasks.length}</div>
                    </div>
                    
                    <div className="flex flex-wrap gap-2">
                      <button onClick={() => openEdit(quest)} className="bg-blue-700 hover:bg-blue-600 text-sm px-3 py-2 rounded font-bold text-white">✏️ Edit</button>
                      <button onClick={() => resetQuest(quest)} className="bg-purple-700 hover:bg-purple-600 text-sm px-3 py-2 rounded font-bold text-white">🔄 Reset</button>
                      <button onClick={() => abandonQuest(quest)} className="bg-red-700 hover:bg-red-600 text-sm px-3 py-2 rounded font-bold text-white">🏃 Abandon</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>

          </div>

          {/* Modals */}
          {combatTarget && (
            <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
              <div className="bg-gray-800 p-6 border-4 border-red-600 rounded max-w-sm w-full text-center">
                <h2 className="text-2xl text-red-500 mb-2 font-bold pixel-text">{combatTarget.isBoss ? '🐉 Boss Fight!' : '👹 Επίθεση σε Mob!'}</h2>
                <p className="mb-6 text-white font-bold">{combatTarget.name || combatTarget.title}</p>
                <div className="flex flex-col gap-3">
                  <button onClick={() => executeCombat('attack')} className="bg-red-700 hover:bg-red-600 p-3 rounded font-bold text-white">⚔️ Επίθεση (DMG)</button>
                  <button onClick={() => executeCombat('defend')} className="bg-blue-700 hover:bg-blue-600 p-3 rounded font-bold text-white">🛡️ Άμυνα (0 DMG)</button>
                  <button onClick={() => setCombatTarget(null)} className="bg-gray-600 p-3 rounded font-bold text-white mt-2">Ακύρωση</button>
                </div>
              </div>
            </div>
          )}

          {showQuestModal && (
            <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
              <div className="bg-gray-800 p-6 border-2 border-yellow-600 rounded max-w-md w-full">
                <h2 className="text-xl mb-4 text-yellow-400 font-bold pixel-text">{editingQuest ? '✏️ Επεξεργασία Quest' : 'Νέο Quest'}</h2>
                <form onSubmit={handleSaveQuest} className="space-y-4">
                  <div>
                    <label className="block text-sm text-gray-300">Τίτλος Quest (Boss)</label>
                    <input required value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="w-full bg-gray-700 text-white p-2 rounded" />
                  </div>
                  <div>
                    <label className="block text-sm text-gray-300">Priority (1-10)</label>
                    <input type="number" min="1" max="10" required value={formData.priority} onChange={e => setFormData({...formData, priority: e.target.value})} className="w-full bg-gray-700 text-white p-2 rounded" />
                  </div>
                  <div>
                    <label className="block text-sm text-gray-300">Microtasks (Χωρισμένα με κόμμα)</label>
                    <textarea required value={formData.microtasks} onChange={e => setFormData({...formData, microtasks: e.target.value})} className="w-full bg-gray-700 text-white p-2 rounded h-24" />
                  </div>
                  <div className="flex gap-3 justify-end mt-6">
                    <button type="button" onClick={() => setShowQuestModal(false)} className="bg-gray-600 px-4 py-2 rounded text-white font-bold">Ακύρωση</button>
                    <button type="submit" className="bg-yellow-600 text-black px-4 py-2 rounded font-bold">Αποθήκευση</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
